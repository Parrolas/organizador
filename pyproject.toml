[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador-estudo"
version = "0.1.0"
description = "Organizador local de ficheiros e estudo para Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7,<1",
    "openpyxl>=3.1,<4",
    "PySide6-Essentials>=6.8,<7",
    "pypdf>=6,<7",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "rapidfuzz>=3.10,<4",
    "watchdog>=6,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
    "types-openpyxl>=3.1,<4",
]
build = ["pyinstaller>=6.12,<7"]

[project.scripts]
organizador = "organizador.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["organizador"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["organizador"]
