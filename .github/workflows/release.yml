name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The legacy update E2E needs the previous release tag's sources.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-release.txt

      - name: Install pinned release environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Virtual environment creation failed" }
          .\.venv\Scripts\python.exe -m pip install --upgrade "pip==26.2.1"
          if ($LASTEXITCODE -ne 0) { throw "Pinned pip installation failed" }
          $ConstraintPath = (Resolve-Path -LiteralPath "constraints-release.txt").Path
          $env:PIP_CONSTRAINT = ([System.Uri]$ConstraintPath).AbsoluteUri
          .\.venv\Scripts\python.exe -m pip install -c constraints-release.txt -e ".[dev,build]"
          if ($LASTEXITCODE -ne 0) { throw "Pinned release environment installation failed" }
          .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Release environment dependency check failed" }

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "from organizador import __version__; print(__version__)").Trim()
          if ("v$Version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$Version"
          }

      - name: Build, test and smoke-test package
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Publish prerelease assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "from organizador import __version__; print(__version__)").Trim()
          $Archive = "dist\releases\Organizador-$Version-windows-x64.zip"
          $Checksum = "$Archive.sha256"
          gh release view "v$Version" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release v$Version already exists; published assets are immutable"
          }
          gh release create "v$Version" $Archive $Checksum --verify-tag --generate-notes --title "Organizador v$Version" --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease publication failed" }

      - name: Download the exact public prerelease assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "from organizador import __version__; print(__version__)").Trim()
          New-Item -ItemType Directory -Path e2e-public -Force | Out-Null
          gh release download "v$Version" --dir e2e-public --pattern "Organizador-$Version-windows-x64.zip*"
          if ($LASTEXITCODE -ne 0) { throw "Public prerelease download failed" }
          $LocalHash = ((Get-Content -LiteralPath "dist\releases\Organizador-$Version-windows-x64.zip.sha256" -Raw).Trim() -split '\s+')[0]
          $PublicHash = ((Get-Content -LiteralPath "e2e-public\Organizador-$Version-windows-x64.zip.sha256" -Raw).Trim() -split '\s+')[0]
          if ($LocalHash -ne $PublicHash) { throw "Public prerelease bytes differ from the tested candidate" }
          $ActualHash = (Get-FileHash -LiteralPath "e2e-public\Organizador-$Version-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualHash -ne $PublicHash.ToLowerInvariant()) { throw "Public prerelease checksum mismatch" }

      - name: Legacy update end-to-end gate
        shell: pwsh
        run: |
          $Version = (& .\.venv\Scripts\python.exe -c "from organizador import __version__; print(__version__)").Trim()
          .\scripts\run_update_release_e2e.ps1 -CandidateZip "e2e-public\Organizador-$Version-windows-x64.zip" -CandidateVersion $Version
        # On failure the prerelease stays unpublished to /releases/latest (manual
        # bridge policy): old installations are never offered an unsafe update.

      - name: Upload E2E evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-e2e-evidence
          path: |
            update-e2e-evidence-*.log
            e2e-public/

      # Manual bridge policy (v0.6.2): the exact v0.6.1 updater was proven to
      # silently no-op on non-ASCII install paths (its .cmd helper misreads
      # UTF-8 paths), so v0.6.2 stays a prerelease and is NEVER auto-promoted:
      # /releases/latest keeps returning v0.6.1 and no installed app is offered
      # an update it cannot apply. Promote manually only once the installed
      # base runs an updater that is proven Unicode-safe end to end.
